<div class="toast-container">
  @for (toast of toasts; track toast.id) {
    <div class="toast-notification toast-{{ toast.type }}" 
         [class.clickable]="toast.url"
         (click)="onToastClick(toast)">
      <div class="toast-content">
        <span class="toast-icon">{{ getIcon(toast.type) }}</span>
        <span class="toast-message">{{ toast.message }}</span>
      </div>
      <button class="toast-close" (click)="removeToast(toast.id); $event.stopPropagation()">&times;</button>
      <div class="toast-progress" [style.animation-duration.ms]="toast.duration"></div>
    </div>
  }
</div>
