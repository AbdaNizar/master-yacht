<div class="auth-container">
  <!-- Left Side - Brand & Image -->
  <div class="brand-section">
    <div class="brand-overlay">
      <div class="brand-content">
        <div class="logo-container">
          <i class="fas fa-anchor"></i>
          <h1>Master Yacht</h1>
        </div>
        <p class="tagline">Votre aventure maritime commence ici</p>
        <div class="features">
          <div class="feature-item">
            <i class="fas fa-ship"></i>
            <span>Yachts de luxe</span>
          </div>
          <div class="feature-item">
            <i class="fas fa-shield-alt"></i>
            <span>Réservation sécurisée</span>
          </div>
          <div class="feature-item">
            <i class="fas fa-star"></i>
            <span>Service premium</span>
          </div>
        </div>
      </div>
    </div>
    <img ngSrc="assets/img/default/yacht_modern2.webp" alt="Yacht moderne" class="yacht-image" height="1024" width="1024"/>
  </div>

  <!-- Right Side - Form -->
  <div class="form-section">
    <div class="form-container">
      <div class="form-header">
        <h2>Bienvenue !</h2>
        <p>Connectez-vous pour accéder à votre espace</p>
      </div>

      <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">
            <i class="fas fa-envelope"></i>
            Adresse e-mail
          </label>
          <input
            class="input-field"
            type="email"
            id="email"
            name="email"
            [(ngModel)]="user.email"
            placeholder="exemple@email.com"
            required
            email
          />
        </div>

        <div class="form-group">
          <label for="password">
            <i class="fas fa-lock"></i>
            Mot de passe
          </label>
          <div class="password-input">
            <input
              class="input-field"
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="user.password"
              placeholder="••••••••"
              required
            />
            <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
              <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" name="remember">
            <span>Se souvenir de moi</span>
          </label>
          <a href="#" class="forgot-password">Mot de passe oublié ?</a>
        </div>

        <app-button-loader 
          type="submit" 
          [loading]="isLoading"
          [disabled]="!loginForm.valid"
          buttonClass="btn-primary"
          icon="fas fa-arrow-right">
          Se connecter
        </app-button-loader>
      </form>



      <div class="register-link">
        <p>Pas encore de compte ? <a (click)="goToRegister()">Créer un compte</a></p>
      </div>
    </div>
  </div>
</div>
