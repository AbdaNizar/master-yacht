<!-- Toast Container Global -->
<app-toast-container></app-toast-container>

<div class="app-container" [class.initialized]="showSidebar">
  <!-- Header -->
  @if (showSidebar) {
    <app-header [class.sidebar-collapsed]="isSidebarCollapsed"></app-header>
  }

  <!-- Main Content -->
  <main class="app-main">
    @if (showSidebar) {
      <div class="dashboard-layout">
        <app-sidebar></app-sidebar>
        <div class="content" 
             [class.sidebar-collapsed]="isSidebarCollapsed"
             [class.content-ready]="showSidebar">
          <router-outlet></router-outlet>
        </div>
      </div>
    } @else {
      <router-outlet></router-outlet>
    }
  </main>
</div>
